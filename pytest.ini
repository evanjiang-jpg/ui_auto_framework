[pytest]
; ==============================================================
; pytest 运行配置
; 说明：项目根目录刻意不放 __init__.py
;   pytest 以「往上找第一个不含 __init__.py 的目录」判定项目根，
;   根目录放 __init__.py 会导致项目根跑到上级目录，出现
;   ModuleNotFoundError: No module named 'common'
; ==============================================================

testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; pythonpath 作为双保险（需 pytest >= 7.0）
pythonpath = .

addopts =
    -v
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir

markers =
    ; ---------- 执行层级（CI 卡点用） ----------
    smoke:      冒烟用例（核心主流程，发版卡点，必须全过）
    p0:         高优先级用例（核心业务功能，阻塞流程）
    p1:         中优先级用例（常规功能，回归必跑）
    p2:         低优先级用例（边缘场景/异常分支）
    ; ---------- 业务模块 ----------
    login:      登录模块
    order:      订单模块
    user:       用户/个人中心模块
    payment:    支付模块
    search:     搜索模块
    ; ---------- 用例类型 ----------
    ui:         UI 交互测试
    api:        接口测试
    db:         数据库断言用例
    regression: 回归测试用例
    ; ---------- 执行特征 ----------
    slow:       慢速用例（耗时长，默认不跑，全量回归时带上）
    flaky:      不稳定用例（已知偶发失败，配合 --reruns 自动重试）
    skip_ci:    本地调试用例，CI 上自动跳过（如需真人验证码）

; 日志：仅显示 WARNING 以上，避免刷屏；用例内调试请用 -s 或看 logs/ 目录
log_cli = false
log_level = WARNING