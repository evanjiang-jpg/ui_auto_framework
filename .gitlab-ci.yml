# ==============================================================
# GitLab CI — 对齐 GitHub Actions workflow 逻辑
# 对标文件：.github/workflows/ui-test.yml
# 4 个 stage：
#   ci → image → deploy → notify（notify 无论成败都跑）
# ─────────────────────────────────────────────────────────────
# 使用前请在 GitLab Settings → CI/CD → Variables 里配：
#   DINGTALK_WEBHOOK / DINGTALK_SECRET / FEISHU_WEBHOOK / FEISHU_SECRET
#   EMAIL_SMTP_HOST / EMAIL_USER / EMAIL_PASSWORD / EMAIL_RECEIVERS
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH（可选）
# 查看当前远程（应该是 GitHub）
# git remote -v
# # 输出：origin  https://github.com/evanjiang-jpg/ui_auto_framework.git (fetch/push)

# # 方案 A：添加 GitLab 作为第二个远程（保留 GitHub）
# git remote add gitlab https://gitlab.com/ 你的用户名/ui_auto_framework.git

# # 方案 B：直接把 origin 改成 GitLab（替换 GitHub）
# git remote set-url origin https://gitlab.com/ 你的用户名/ui_auto_framework.git

# # 推送到 GitLab
# git push -u gitlab main
# # 或者如果你替换了 origin：
# git push -u origin main
# ==============================================================

stages:
  - ci          # ① 跑测试 + Allure + artifact
  - image       # ② Docker build push 到 GitLab Registry
  - deploy      # ③ SSH 部署（手动审批，对标 GitHub environment: test）
  - notify      # ④ 通知（无论前面成败都跑，always）

variables:
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  ENV: "test"
  IMAGE_NAME: "$CI_PROJECT_PATH"
  REGISTRY: "$CI_REGISTRY"

# --------------------------------------------------------------
# 公共模板（避免每个 job 重复写安装依赖）
# --------------------------------------------------------------
.prepare_template: &prepare
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  before_script:
    - pip install --cache-dir=.pip-cache --upgrade pip -q
    - pip install --cache-dir=.pip-cache -r requirements.txt -q

# --------------------------------------------------------------
# ① CI — 跑测试 / 生成 Allure / 上传 artifact
#     对应 workflow 的 ui-test job
# --------------------------------------------------------------
ci-test:
  <<: *prepare
  stage: ci
  script:
    - python run.py --list-envs
    - python run.py --list-markers
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        SCOPE="smoke"
      else
        SCOPE="${SCOPE:-p0 or p1}"
      fi
      echo "执行范围: $SCOPE"
      python run.py -m "$SCOPE" -n 4 --reruns 2 --reruns-delay 1 --no-report || true
    - allure generate allure-results -o allure-report --clean || true
  artifacts:
    paths:
      - allure-results/
      - allure-report/
      - logs/
      - screenshots/
    expire_in: 30 days
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

# --------------------------------------------------------------
# ② CD — Docker 镜像推 GitLab Registry
#     对应 workflow 的 image job
#     对标京东 JDOS 制品库
#
# 注意：jihulab 共享 Runner 可能不支持 DinD（需要 privileged）
#   方案 A：DinD（services: docker:dind）—— 支持 privileged 的 Runner
#   方案 B：Docker Socket 绑定（/var/run/docker.sock）—— 企业自建 Runner 常用
#   方案 C：降级跳过 —— 两者都不行时跳过，不阻塞流水线
# --------------------------------------------------------------
cd-image:
  stage: image
  image: docker:24-cli
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "=== 检查 Docker 可用性 ==="
    - |
      if ! docker info >/dev/null 2>&1; then
        echo "⚠️ 当前 Runner 不支持 DinD，尝试 Docker Socket 绑定..."
        if [ -S /var/run/docker.sock ]; then
          echo "✅ 检测到 /var/run/docker.sock，使用宿主 Docker"
          export DOCKER_HOST=unix:///var/run/docker.sock
        else
          echo "❌ 既不支持 DinD 也没有 Docker Socket，跳过镜像构建"
          exit 0
        fi
      fi
    - docker version
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "🔨 构建镜像：$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  after_script:
    - echo "✅ 镜像推送成功：$CI_REGISTRY_IMAGE:latest"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# --------------------------------------------------------------
# ③ CD — SSH 部署到测试环境（手动审批）
#     对应 workflow 的 deploy-test job + environment: test
#     对标京东 BOE 持续交付，手动点 "▶ Run" 才执行
# --------------------------------------------------------------
cd-deploy-test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      if [ -n "$DEPLOY_HOST" ]; then
        USER="${DEPLOY_USER:-root}"
        PATH="${DEPLOY_PATH:-/opt/ui_auto_framework}"
        echo "=== SSH 部署到 $USER@$DEPLOY_HOST ==="
        ssh $USER@$DEPLOY_HOST "cd $PATH && \
          echo '=== 拉取代码 ===' && \
          git pull --ff-only origin main && \
          echo '=== 拉取镜像 ===' && \
          docker pull $CI_REGISTRY_IMAGE:latest && \
          echo '=== 重启容器 ===' && \
          docker compose up -d --remove-orphans && \
          echo '=== 清理旧镜像 ===' && \
          docker image prune -f && \
          echo '=== 运行状态 ===' && \
          docker compose ps"
        echo "✅ SSH 部署完成"
      else
        echo "⚠️ 未配置 DEPLOY_HOST，跳过部署"
      fi
  environment:
    name: test
    url: http://$DEPLOY_HOST
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

# --------------------------------------------------------------
# ④ 通知 — 无论前面成败都跑
#     对应 workflow 的 notify job + needs + if: always()
#     run.py --notify-only 统一处理飞书/钉钉/邮件
# --------------------------------------------------------------
notify:
  <<: *prepare
  stage: notify
  needs:
    - job: ci-test
      artifacts: true
  script:
    - cp -r allure-results/ ./allure-results 2>/dev/null || mkdir -p ./allure-results
    - python run.py --notify-only || echo "⚠️ 通知通道有失败，已跳过"
  variables:
    ALLURE_REPORT_URL: "${CI_PAGES_URL}/allure-report"
    CI_PIPELINE_ID: "${CI_PIPELINE_ID}"
    CI_COMMIT_AUTHOR: "${CI_COMMIT_AUTHOR}"
    CI_COMMIT_MSG: "${CI_COMMIT_MESSAGE}"
    CI_BUILD_URL: "${CI_PIPELINE_URL}"
  when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'