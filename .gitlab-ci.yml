stages:
  - ci
  - image
  - deploy
  - notify

variables:
  PYTHON_VERSION: "3.10"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  ENV: "test"

.prepare_template: &prepare
  image: python:${PYTHON_VERSION}-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip-cache/
  before_script:
    - pip install --cache-dir=.pip-cache --upgrade pip -q
    - pip install --cache-dir=.pip-cache -r requirements.txt -q

ci-test:
  <<: *prepare
  stage: ci
  script:
    - python run.py --list-envs
    - python run.py --list-markers
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        SCOPE="smoke"
      else
        SCOPE="${SCOPE:-p0 or p1}"
      fi
      echo "执行范围: $SCOPE"
      python run.py -m "$SCOPE" -n 4 --reruns 2 --reruns-delay 1 --no-report || true
    - allure generate allure-results -o allure-report --clean || true
  artifacts:
    paths:
      - allure-results/
      - allure-report/
      - logs/
      - screenshots/
    expire_in: 30 days
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

cd-image:
  stage: image
  image: docker:24-cli
  services:
    - name: docker:24-dind
      command: ["--tls=false", "--registry-mirror", "https://docker.1ms.run", "--registry-mirror", "https://dockerhub.timeweb.cloud"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - docker version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_PROJECT_DIR"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

cd-deploy-test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      if [ -n "$DEPLOY_HOST" ]; then
        USER="${DEPLOY_USER:-root}"
        PATH="${DEPLOY_PATH:-/opt/ui_auto_framework}"
        echo "=== SSH 部署到 $USER@$DEPLOY_HOST ==="
        ssh $USER@$DEPLOY_HOST "cd $PATH && \
          echo '=== 拉取代码 ===' && \
          git pull --ff-only origin main && \
          echo '=== 拉取镜像 ===' && \
          docker pull $CI_REGISTRY_IMAGE:latest && \
          echo '=== 重启容器 ===' && \
          docker compose up -d --remove-orphans && \
          echo '=== 清理旧镜像 ===' && \
          docker image prune -f && \
          echo '=== 运行状态 ===' && \
          docker compose ps"
        echo "SSH 部署完成"
      else
        echo "未配置 DEPLOY_HOST, 跳过部署"
      fi
  environment:
    name: test
    url: http://$DEPLOY_HOST
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

notify:
  <<: *prepare
  stage: notify
  needs:
    - job: ci-test
      artifacts: true
  script:
    - cp -r allure-results/ ./allure-results 2>/dev/null || mkdir -p ./allure-results
    - python run.py --notify-only || echo "通知通道有失败, 已跳过"
  variables:
    ALLURE_REPORT_URL: "${CI_PAGES_URL}/allure-report"
    CI_PIPELINE_ID: "${CI_PIPELINE_ID}"
    CI_COMMIT_AUTHOR: "${CI_COMMIT_AUTHOR}"
    CI_COMMIT_MSG: "${CI_COMMIT_MESSAGE}"
    CI_BUILD_URL: "${CI_PIPELINE_URL}"
  when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'